<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evan">
<meta name="theme-color" content="#0F1C2E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>Evan’s Hub</title>
<style>
/* ===== Evan's Hub – Navy Tactical (V11) ===== */
:root{
 --bg:#0F1C2E;--bg2:#0C1726;--card:#16253C;--soft:#1C2E49;--line:#21354F;--line2:#2A4163;
 --text:#EEF1F5;--muted:#8D9BB0;--dim:#5F6F88;
 --accent:#F2994A;--accent2:#FFB26B;--onAccent:#0F1C2E;
 --good:#5ED6A0;--goodBg:rgba(94,214,160,.12);--bad:#FF5A4E;--badBg:rgba(255,90,78,.12);--warn:#F2C94C;--warnBg:rgba(242,201,76,.12);--info:#6FA8FF;--infoBg:rgba(111,168,255,.10);
 --track:#25395A;--r:6px;--r2:10px;
 --disp:"DIN Condensed","DIN Alternate","Avenir Next Condensed",sans-serif;
 --num:"DIN Alternate","DIN Condensed",-apple-system,sans-serif;
 --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#16294A 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 128px}
h1{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:2px 0 0;line-height:1}
h2{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;line-height:1.1}
h3{font-size:10.5px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.muted{color:var(--muted);font-size:13px}.small{font-size:13px}.xs{font-size:11px}
.upper{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;font-weight:800;opacity:.85}
b,strong{font-weight:700}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.ico.sm{width:14px;height:14px;vertical-align:-2px}.ico.lg{width:22px;height:22px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin:10px 0;position:relative}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.99)}
.card>h2:first-child,.card .row>h2{margin-bottom:0}
.card .row.between+*{margin-top:10px}

/* top header */
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}
.dateline{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#1B3152 0%,#13233B 100%);border:1px solid var(--line2);border-radius:var(--r2);padding:16px 16px 14px 20px;margin:12px 0}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 11px,rgba(255,255,255,.022) 11px 12px);pointer-events:none}
.heroTop{display:flex;gap:4px;position:relative;z-index:1}
.heroTop>div{flex:1;padding:0;background:none}
.heroTop>div+div{border-left:1px solid var(--line2);padding-left:12px}
.heroTop b{display:block;font-family:var(--num);font-size:38px;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.heroTop>div:first-child b{color:var(--accent)}
.heroTop span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;line-height:1.3;display:block;margin-top:4px}
.quote{position:relative;z-index:1;font-size:16px;font-weight:700;line-height:1.35;margin:14px 0 4px}
.heroLine{position:relative;z-index:1;font-size:12.5px;color:var(--muted)}

/* action card */
.action{background:var(--card);border:1px solid var(--line2);padding:16px}
.action:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--r2) var(--r2) 0 0;background:var(--accent)}
.action.mon:before,.action.late:before{background:var(--warn)}.action.late:before{background:var(--bad)}
.action h2{font-size:28px;margin:6px 0 2px}
.action .btn{margin-top:14px}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:11px 12px;margin:10px 0;font-weight:600;font-size:13.5px;line-height:1.35;border:1px solid var(--line);background:var(--soft)}
.banner .ico{margin-top:1px}
.banner.warn{background:var(--warnBg);border-color:rgba(242,201,76,.35)}.banner.warn>.ico{color:var(--warn)}
.banner.bad{background:var(--badBg);border-color:rgba(255,90,78,.4)}.banner.bad>.ico{color:var(--bad)}
.banner.info{background:var(--infoBg);border-color:rgba(111,168,255,.3)}.banner.info>.ico{color:var(--info)}
.banner.good{background:var(--goodBg);border-color:rgba(94,214,160,.35)}.banner.good>.ico{color:var(--good)}
.refcard{width:15px;height:20px;border-radius:2px;flex:none;transform:rotate(-8deg);margin-top:1px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.refcard.y{background:var(--warn)}.refcard.r{background:var(--bad)}

/* layout */
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack>*+*{margin-top:8px}

/* stats */
.stat{background:var(--soft);border-radius:var(--r);padding:10px 11px;border-left:3px solid var(--line2)}
.stat b{display:block;font-family:var(--num);font-size:26px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:800;display:block;margin-top:4px}
.grid3 .stat:first-child,.grid2 .stat:first-child{border-left-color:var(--accent)}

/* scoreboard */
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{background:var(--soft);border-radius:var(--r);padding:10px 12px;border-left:3px solid var(--accent)}
.score+.score{border-left-color:var(--good)}
.score .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.score .val{font-family:var(--num);font-size:34px;font-weight:700;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.score .val small{font-size:20px;color:var(--dim)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:var(--r);background:var(--accent);color:var(--onAccent);padding:12px 16px;min-height:48px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;width:100%;font-family:var(--body);cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.big{min-height:54px;font-size:14px;margin-top:12px}
.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--line2)}
.btn.good{background:var(--accent);color:var(--onAccent)}
.btn.bad{background:transparent;border:1px solid rgba(255,90,78,.55);color:#FF8A80}
.btn.sm{min-height:36px;padding:7px 11px;font-size:11px;width:auto}
.btn .ico{width:16px;height:16px}

/* inputs */
input,select,textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:10px 11px;font-size:16px;min-height:44px;font-family:var(--body);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,153,74,.18)}
input.carry{color:var(--dim);border-style:dashed}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
input[type=file]{padding:8px;font-size:13px}
label{display:block;font-size:10.5px;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.xs{padding:1px 5px;font-size:8.5px}
.chip.D{color:#9CC3FF;border-color:#2C4C7C;background:rgba(111,168,255,.1)}
.chip.N{color:#C3B3FF;border-color:#463C7A;background:rgba(160,140,255,.1)}
.chip.O{color:var(--good);border-color:#24594A;background:var(--goodBg)}
.chip.done,.chip.minimum,.chip.short{color:var(--good);border-color:#24594A;background:var(--goodBg)}
.chip.missed,.chip.skipped{color:#FF8A80;border-color:#6A2A2A;background:var(--badBg)}
.chip.excused{color:var(--muted)}.chip.pending{color:var(--dim)}
.chip.late{color:var(--warn);border-color:#6A5520;background:var(--warnBg)}
.chip.acc{color:var(--accent);border-color:#6A4422;background:rgba(242,153,74,.1)}

/* bars */
.bar{height:5px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:7px}
.bar div{height:100%;background:var(--accent);border-radius:2px;transition:width .6s ease}
.bar .g{background:var(--good)}.bar .c{background:var(--accent)}.bar .s{background:var(--accent)}.bar .w{background:var(--info)}.bar .p{background:var(--warn)}

/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wd{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px 2px 7px;text-align:center;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.wd>b{font-size:10px;color:var(--muted);letter-spacing:.08em}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.wd.today>b{color:var(--accent)}
.wi{border-radius:3px;padding:2px 2px;font-size:9px;font-weight:800;letter-spacing:.03em;background:var(--soft);color:var(--muted);width:88%;display:flex;justify-content:center}
.wi .ico{width:11px;height:11px}
.wi.done,.wi.short,.wi.minimum{background:var(--goodBg);color:var(--good)}.wi.missed,.wi.skipped{background:var(--badBg);color:#FF8A80}.wi.none{background:none;color:var(--dim)}

/* rows */
.itemRow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.itemRow:last-child{border:0;padding-bottom:0}.itemRow>div:last-child{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.itemRow b{font-family:var(--disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.itemRow.past{opacity:.5}
.why{font-style:italic;color:var(--muted);text-align:center;padding:4px 16px;font-size:14px}

/* rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.ring{background:none;border:0;color:var(--text);padding:0;font-family:var(--body);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.ring:active{transform:scale(.95)}
.ring .rwrap{position:relative;width:100%;max-width:76px;aspect-ratio:1}
.ring svg.r{width:100%;height:100%;display:block}
.ring svg.r circle{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring .ri{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring .ri .ico{width:22px;height:22px}
.ring .rv{font-family:var(--num);font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.ring .rl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-top:1px}
.ring.full .rwrap{filter:drop-shadow(0 0 7px rgba(94,214,160,.45))}.ring.full .rl{color:var(--good)}
.ess>div{padding:8px 0;border-bottom:1px solid var(--line)}.ess>div:last-child{border:0}

/* segmented / pills */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:3px;margin-top:8px}
.seg button{background:none;border:0;color:var(--muted);min-height:36px;border-radius:4px;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body)}
.seg button.sel{background:var(--accent);color:var(--onAccent)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pills button{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:var(--r);min-height:44px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--body)}
.pills button.sel{border-color:var(--accent);color:var(--accent);background:rgba(242,153,74,.1)}

/* plan */
.planDay{display:grid;grid-template-columns:50px 34px 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.planDay:last-child{border:0}
.planDay>div:first-child b{font-family:var(--disp);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.shiftBtn{min-height:32px;width:34px;justify-content:center;font-size:11px}
.pi{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:var(--r);padding:6px 9px;margin-bottom:5px;font-weight:700;font-size:13.5px}
.pi.match{border-left-color:var(--warn)}.pi.cardio{border-left-color:var(--info)}.pi.walk{border-left-color:var(--good)}
.pi .x{background:none;border:0;color:#FF8A80;font-size:20px;line-height:1;padding:0 4px}
select.add{min-height:34px;padding:5px 26px 5px 9px;font-size:13px;color:var(--muted);background-color:transparent;border-style:dashed}

/* train */
.ex{margin:8px 0}
.ex>.row b{font-size:15px}
.tip{display:flex;gap:7px;align-items:flex-start;border-radius:var(--r);padding:8px 10px;font-size:12px;margin:9px 0;line-height:1.35}
.tip .ico{width:15px;height:15px;margin-top:0}
.tip.info{background:var(--infoBg);color:#C9DBFF}.tip.info .ico{color:var(--info)}
.tip.good{background:rgba(242,153,74,.12);color:#FFD2AA}.tip.good .ico{color:var(--accent)}
.setRow{display:grid;grid-template-columns:40px 1fr 1fr 46px;gap:6px;margin-top:6px;align-items:center}
.setRow>span{font-family:var(--num);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase}
.setRow input{font-family:var(--num);font-size:17px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.setRow.done input{border-color:rgba(94,214,160,.6);color:var(--text);background:rgba(94,214,160,.06)}
.setRow.warm>span{color:var(--warn)}.setRow.warm input{border-style:dotted}
.setRow.extra>span{color:var(--accent)}
.tick{min-height:44px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg2);color:var(--dim);display:flex;align-items:center;justify-content:center}
.tick .ico{width:20px;height:20px;stroke-width:2.4}
.tick.on{background:var(--good);color:#0B2A1C;border-color:var(--good)}
.setBtns{display:flex;gap:6px;margin-top:9px}
.setBtns button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted);min-height:34px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.exBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.exBtns button{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);color:var(--text);min-height:34px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.exBtns .ico{width:14px;height:14px;color:var(--accent)}

/* rest timer */
#restBar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 74px);max-width:536px;margin:auto;background:#1B3152;border:1px solid var(--line2);border-left:4px solid var(--accent);border-radius:var(--r2);padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#restBar span{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#restBar b{font-family:var(--num);font-size:30px;font-variant-numeric:tabular-nums;color:var(--accent)}
#restBar button{background:var(--soft);border:1px solid var(--line2);color:var(--text);border-radius:var(--r);padding:8px 11px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#restBar.doneR{border-left-color:var(--good);background:#143A30}#restBar.doneR b{flex:1;font-size:17px;color:var(--good);font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase}

/* misc */
.note{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px;margin-top:8px;line-height:1.45}
.check{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--text);font-size:14.5px;margin:0;text-transform:none;letter-spacing:0;font-weight:500}
.check input{width:20px;min-height:20px;height:20px}
table.bal{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
table.bal th{color:var(--muted);font-weight:800;text-align:right;padding:5px 4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em}
table.bal th:first-child,table.bal td:first-child{text-align:left}
table.bal td{text-align:right;padding:7px 4px;border-top:1px solid var(--line);font-family:var(--num);font-weight:700}
table.bal td:first-child{font-family:var(--body);font-weight:500;color:var(--muted)}
.pos{color:var(--good)}.neg{color:#FF8A80}
.photoCmp img{width:100%;border-radius:var(--r);display:block;border:1px solid var(--line2)}.photoCmp figure{margin:0}.photoCmp figcaption{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
details.card summary{list-style:none;cursor:pointer}details.card summary::-webkit-details-marker{display:none}
details summary{color:var(--accent);font-size:12px;cursor:pointer;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
code{font-size:11px;word-break:break-all;background:var(--bg2);padding:1px 4px;border-radius:3px;color:var(--accent2)}
svg text{fill:var(--muted);font-size:10px;font-family:var(--num)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(12,23,38,.92);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);padding:7px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:50}
nav button{flex:1;max-width:108px;background:none;border:0;color:var(--dim);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 0 3px;position:relative;font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .ico{width:22px;height:22px}
nav button.sel{color:var(--accent)}
nav button.sel:before{content:"";position:absolute;top:-8px;left:30%;right:30%;height:2px;background:var(--accent);border-radius:2px}
.dotB{position:absolute;top:2px;right:30%;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg2)}

/* sheet + toast */
.sheet{position:fixed;inset:0;background:rgba(5,10,18,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:99}.hidden{display:none!important}
.sheetBox{background:var(--card);border-top:1px solid var(--line2);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;animation:up .22s ease-out}
.sheetBox:before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);z-index:200;max-width:528px;margin:auto;background:#143A30;border:1px solid rgba(94,214,160,.5);border-left:4px solid var(--good);border-radius:var(--r2);padding:12px 14px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:up .2s ease-out}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(8,15,27,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.celebrate .cbox{text-align:center;padding:30px 26px;max-width:340px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate .badge{width:92px;height:92px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#FFB26B,#F2994A 55%,#B8641E);box-shadow:0 0 0 6px rgba(242,153,74,.18),0 0 40px rgba(242,153,74,.45)}
.celebrate .badge .ico{width:44px;height:44px;color:#0F1C2E;stroke-width:2.2}
.celebrate .ct{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800}
.celebrate .cm{font-family:var(--disp);font-size:36px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;margin:6px 0 8px}
.celebrate .cs{color:var(--muted);font-size:14px;margin-bottom:20px}
.spark{position:fixed;width:6px;height:12px;border-radius:1px;z-index:301;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* summary */
.sumGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.pb{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pb:last-child{border:0}.pb .ico{color:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<div id="restBar" class="hidden"></div>
<nav id="nav"></nav>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div class="sheetBox" id="sheetBox"></div></div>
<script src="app.js?v=11"></script>
<script>boot()</script>
</body>
</html>
